name: 'Dashboard Preview'

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name to build'
        required: true
        type: string
      use_oss:
        description: 'Use OSS repo (daytonaio/daytona) instead of daytonaio/daytona-ai'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  build:
    name: Build dashboard
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout target repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.use_oss && 'daytonaio/daytona' || 'daytonaio/daytona-ai' }}
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          install-go: 'false'
          install-python: 'false'
          install-ruby: 'false'
          install-java: 'false'
          install-poetry: 'false'
          install-swag: 'false'
          run-poetry-install: 'false'
          run-go-work-sync: 'false'

      - name: Compute deployment slug
        id: slug
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          branch_slug=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-+//; s/-+$//' | cut -c1-20 | sed -E 's/-+$//')
          if [ -z "$branch_slug" ]; then
            echo "Branch name '$BRANCH' produced an empty slug" >&2
            exit 1
          fi
          short_sha=$(git rev-parse --short HEAD)
          echo "deployment_slug=${branch_slug}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Build dashboard
        run: echo VITE_API_URL=https://app.daytona.io/api > apps/dashboard/.env && yarn nx build dashboard --configuration production --skip-nx-cache

      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PREVIEW_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PREVIEW_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: aws s3 sync dist/apps/dashboard "s3://prod-daytona-preview/${{ steps.slug.outputs.deployment_slug }}/" --delete

      - name: Print preview URL
        run: |
          echo "Preview URL: https://${{ steps.slug.outputs.deployment_slug }}.p.daytona.work"
