name: 'Dashboard Preview'

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name to build'
        required: true
        type: string
      use_oss:
        description: 'Use OSS repo (daytonaio/daytona) instead of daytonaio/daytona-ai'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  build:
    name: Build dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.use_oss && 'daytonaio/daytona' || 'daytonaio/daytona-ai' }}
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - name: Checkout setup-toolchain action
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: _workflow_repo
          sparse-checkout: |
            .github/actions
          persist-credentials: false

      - uses: ./_workflow_repo/.github/actions/setup-toolchain
        with:
          install-go: 'false'
          install-python: 'false'
          install-ruby: 'false'
          install-java: 'false'
          install-poetry: 'false'
          install-swag: 'false'
          run-poetry-install: 'false'
          run-go-work-sync: 'false'

      - name: Get short commit SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build dashboard
        run: yarn nx build dashboard --configuration production

      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PREVIEW_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PREVIEW_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: aws s3 sync dist/apps/dashboard "s3://prod-daytona-preview/${{ steps.sha.outputs.short_sha }}/" --delete

      - name: Print preview URL
        run: echo "Preview URL: https://${{ steps.sha.outputs.short_sha }}.p.daytona.work"
