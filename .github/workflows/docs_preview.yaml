name: 'Docs Preview'

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name to build'
        required: true
        type: string

permissions:
  contents: read

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  build:
    name: Build docs
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    outputs:
      branch_slug: ${{ steps.slug.outputs.branch_slug }}
      deployment_slug: ${{ steps.slug.outputs.deployment_slug }}
    steps:
      - name: Checkout target repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: daytonaio/daytona-ai
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          install-go: 'false'
          install-swag: 'false'
          run-go-work-sync: 'false'

      - name: Compute branch and deployment slugs
        id: slug
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          # branch_slug — stable across redeploys of the same branch.
          # Used as the helm release name + ingress hostname prefix.
          branch_slug=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-+//; s/-+$//' | cut -c1-20 | sed -E 's/-+$//')
          if [ -z "$branch_slug" ]; then
            echo "Branch name '$BRANCH' produced an empty slug" >&2
            exit 1
          fi
          # deployment_slug — bumps every commit. Used as the image tag so
          # pods roll on each redeploy.
          short_sha=$(git rev-parse --short HEAD)
          echo "branch_slug=${branch_slug}" >> "$GITHUB_OUTPUT"
          echo "deployment_slug=${branch_slug}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@722e97d12b1d06a961800dd6c05d79d951ad3c80 # v1.8.0

      - name: Build and push docs docker image
        env:
          VERSION: v0.0.0-${{ steps.slug.outputs.deployment_slug }}
          ARCH: -amd64
          PUBLIC_ALGOLIA_DOCS_INDEX_NAME: docs
          PUBLIC_ALGOLIA_CLI_INDEX_NAME: cli
          PUBLIC_ALGOLIA_SDK_INDEX_NAME: sdk
          PUBLIC_ALGOLIA_API_INDEX_NAME: api
          PUBLIC_WEB_URL: https://${{ steps.slug.outputs.branch_slug }}.docs.stage.daytona.work
          PUBLIC_ALGOLIA_APP_ID: YDP75YK0IL
          PUBLIC_ALGOLIA_API_KEY: cc397b32946b98577d305737dc98befa
        run: yarn nx docker docs --configuration production --output-style stream

      - name: Print preview image
        run: |
          echo "Docs image: ghcr.io/daytonaio/daytona-docs:v0.0.0-${{ steps.slug.outputs.deployment_slug }}-amd64"

      - name: Cleanup credentials
        if: always()
        run: |
          docker logout docker.io 2>/dev/null || true
          docker logout ghcr.io 2>/dev/null || true

  deploy:
    name: Deploy to stage
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: build
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      EKS_CLUSTER: stage-eks
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v4.2.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: arn:aws:iam::762233752006:role/stage/stage-gha-daytona-ai
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Deploy with Helm
        env:
          BRANCH_NAME: ${{ inputs.branch }}
          REPO: daytonaio/daytona-ai
        run: |
          helm upgrade --install docs-preview-${{ needs.build.outputs.branch_slug }} ./charts/docs-preview \
            --namespace gha-docs \
            --set image.tag="v0.0.0-${{ needs.build.outputs.deployment_slug }}-amd64" \
            --set ingress.host="${{ needs.build.outputs.branch_slug }}.docs.stage.daytona.work" \
            --set branchName="$BRANCH_NAME" \
            --set repo="$REPO" \
            --wait \
            --timeout 5m

      - name: Clean up old releases
        run: |
          helm list --namespace gha-docs --filter '^docs-preview-' --date --reverse -q | tail -n +11 | xargs -r -I {} helm uninstall {} --namespace gha-docs

      - name: Print preview URL
        run: |
          echo "Preview URL: https://${{ needs.build.outputs.branch_slug }}.docs.stage.daytona.work"
