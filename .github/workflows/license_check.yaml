name: '[PR] License header check'

on:
  pull_request:
    branches:
      - main
      - prod
      - develop

permissions:
  contents: read
  pull-requests: write

concurrency:
  # New commit on branch cancels running workflows of the same branch
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-headers:
    if: github.repository == 'daytonaio/daytona' || github.repository == 'daytonaio/daytona-ai'
    name: No license headers
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      # Check out the PR head (not the merge commit) so file line numbers match
      # the RIGHT side of the diff, which the suggested changes anchor to.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check changed files for license headers
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/check_license_headers.py
