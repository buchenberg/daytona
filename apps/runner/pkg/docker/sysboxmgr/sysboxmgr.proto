// Minimal client stubs for sysbox-mgr's gRPC API (unix:///run/sysbox/sysmgr.sock).
//
// Mirrors nestybox/sysbox-ipc sysboxMgrGrpc/sysboxMgrProtobuf/sysboxMgrProtobuf.proto,
// which is not consumable as a Go module (generated code is not checked in upstream and
// its deps only resolve inside the sysbox workspace). The proto package and service name
// must match upstream exactly — they form the gRPC method path.
//
// Regenerate: protoc --go_out=. --go_opt=paths=source_relative \
//   --go-grpc_out=. --go-grpc_opt=paths=source_relative sysboxmgr.proto

syntax = "proto3";

package protobuf;

option go_package = "github.com/daytonaio/runner/pkg/docker/sysboxmgr";

service sysboxMgrStateChannel {
    rpc Unregister (UnregisterReq) returns (UnregisterResp) {}
}

message UnregisterReq {
    string id = 1;
}

message UnregisterResp {}
