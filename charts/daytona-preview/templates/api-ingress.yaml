{{- if .Values.services.api.ingress.enabled -}}
{{- $fullName := include "preview.fullname" . -}}
{{- $svcPort  := .Values.services.api.service.port -}}
{{- $host     := include "preview.apiHost" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-api
  namespace: {{ include "preview.namespace" . }}
  labels:
    {{- include "preview.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.services.api.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.services.api.ingress.className }}
  ingressClassName: {{ .Values.services.api.ingress.className }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-api
                port:
                  number: {{ $svcPort }}
  {{- if .Values.services.api.ingress.tls }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ .Values.services.api.ingress.tlsSecretName | default (printf "%s-tls" .Values.apiDomain) }}
  {{- end }}
{{- end }}
