{{- if .Values.registry.enabled }}
apiVersion: v1
kind: Service
metadata:
  namespace: {{ include "preview.namespace" . }}
  name: {{ include "preview.fullname" . }}-registry
  labels:
    {{- include "preview.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.registry.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "preview.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: registry
{{- end }}
