apiVersion: v1
kind: Service
metadata:
  name: {{ include "preview.fullname" . }}-runner
  namespace: {{ include "preview.namespace" . }}
  labels:
    {{- include "preview.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
  {{- with .Values.services.runner.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.services.runner.service.type }}
  ports:
    - port: {{ .Values.services.runner.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.services.runner.service.sshGatewayPort | default 2220 }}
      targetPort: ssh-gateway
      protocol: TCP
      name: ssh-gateway
  selector:
    {{- include "preview.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: runner
