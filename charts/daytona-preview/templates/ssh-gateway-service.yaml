apiVersion: v1
kind: Service
metadata:
  name: {{ include "preview.fullname" . }}-ssh-gateway
  namespace: {{ include "preview.namespace" . }}
  labels:
    {{- include "preview.labels" . | nindent 4 }}
    app.kubernetes.io/component: ssh-gateway
  annotations:
    {{- if and (eq .Values.services.sshGateway.service.type "LoadBalancer") .Values.services.sshGateway.service.loadBalancerClass }}
    # Pins the tailnet MagicDNS name so SSH_GATEWAY_URL on the API stays predictable.
    tailscale.com/hostname: {{ include "preview.sshGatewayHost" . | quote }}
    {{- end }}
    {{- with .Values.services.sshGateway.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.services.sshGateway.service.type }}
  {{- if and (eq .Values.services.sshGateway.service.type "LoadBalancer") .Values.services.sshGateway.service.loadBalancerClass }}
  # Exposes the SSH gateway as a tailnet node (MagicDNS) via the Tailscale operator.
  loadBalancerClass: {{ .Values.services.sshGateway.service.loadBalancerClass }}
  {{- end }}
  ports:
    - port: {{ .Values.services.sshGateway.service.port }}
      targetPort: ssh
      protocol: TCP
      name: ssh
  selector:
    {{- include "preview.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ssh-gateway
