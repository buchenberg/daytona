# Optional — surfaced as pod annotations so the preview-environments
# dashboard can resolve the GitHub PR for slugified branch names.
branchName: ""
repo: ""    # e.g. daytonaio/daytona or daytonaio/daytona-ai

replicaCount: 1

image:
  repository: ghcr.io/daytonaio/daytona-docs
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: daytonabot-token

podAnnotations: {}

containerPort: 4321

env:
  FUNCTIONS_PORT: "4321"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx-internal
  host: ""
  annotations: {}
  tls:
    enabled: true
    secretName: docs-stage-tls
  basicAuth:
    enabled: false
    secretName: docs-preview-basic-auth
    realm: "Docs Preview"

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
